name: allsafe-legitimate
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${LEGITIMATE_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - legitimate_net
  app:
    build: ./allsafe
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-allsafe}:${POSTGRES_PASSWORD:-local-demo-db-password}@db:5432/${POSTGRES_DB:-allsafe}
      DEMO_EMAIL: ${DEMO_EMAIL:-elliot.alderson@allsafe.net}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-DemoPass123!}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-45}
      COOKIE_SECURE: 'false' # local HTTP only; enable with HTTPS
    depends_on:
      db:
        condition: service_healthy
    networks:
      - legitimate_net
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-allsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-allsafe}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - legitimate_pgdata:/var/lib/postgresql/data
    networks:
      - legitimate_net
networks:
  legitimate_net:
    internal: true
volumes:
  legitimate_pgdata:
