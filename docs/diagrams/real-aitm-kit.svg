<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Victim stays on the attacker's look-alike domain for the entire session; every request is forwarded live to the real backend using a session kept only on the proxy, and every response is rewritten before being sent back. There is no path by which the victim's browser ever reaches the real backend or holds the real cookie.">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1c1a16; }
    .label { font-size: 12px; fill: #6b6559; }
    .node-label { font-size: 13px; font-weight: 600; }
    .node-sub { font-size: 11px; fill: #6b6559; }
    .safe-line { stroke: #2f6f5e; }
    .safe-text { fill: #2f6f5e; font-weight: 600; }
    .node-box { fill: #ffffff; stroke: #d8d4cc; stroke-width: 1.5; }
    .node-box.attacker { stroke: #9a9484; stroke-dasharray: 4 3; }
    line, path.flow { stroke: #6b6559; stroke-width: 1.6; fill: none; }
  </style>
  <rect width="480" height="560" fill="#faf9f6"></rect>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6559"></path>
    </marker>
    <marker id="arrow2-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"></path>
    </marker>
  </defs>

  <rect class="node-box" x="140" y="16" width="200" height="56" rx="8"></rect>
  <text class="node-label" x="240" y="40" text-anchor="middle">Victim's browser</text>
  <text class="node-sub" x="240" y="56" text-anchor="middle">stays on login-allsafe.evil, TLS</text>

  <rect class="node-box attacker" x="140" y="242" width="200" height="56" rx="8"></rect>
  <text class="node-label" x="240" y="266" text-anchor="middle">Attacker proxy</text>
  <text class="node-sub" x="240" y="282" text-anchor="middle">look-alike domain, valid cert</text>

  <rect class="node-box" x="140" y="468" width="200" height="56" rx="8"></rect>
  <text class="node-label" x="240" y="492" text-anchor="middle">Real backend</text>
  <text class="node-sub" x="240" y="508" text-anchor="middle">allsafe.net</text>

  <line x1="205" y1="72" x2="205" y2="242" marker-end="url(#arrow2)"></line>
  <text class="label" x="195" y="150" text-anchor="end">every request: login, pages, assets</text>

  <line x1="205" y1="298" x2="205" y2="468" marker-end="url(#arrow2)"></line>
  <text class="label" x="195" y="390" text-anchor="end">forwarded live, stored session</text>

  <line x1="280" y1="468" x2="280" y2="298" marker-end="url(#arrow2)"></line>
  <text class="label safe-text" x="290" y="390" text-anchor="start">real cookie — kept here only</text>

  <line x1="280" y1="242" x2="280" y2="72" marker-end="url(#arrow2)"></line>
  <text class="label" x="290" y="150" text-anchor="start">rewritten page + proxy's own cookie</text>

  <path class="flow safe-line" d="M 340 270 C 400 270, 400 230, 340 230" marker-end="url(#arrow2-safe)"></path>
  <text class="safe-text label" x="408" y="255" text-anchor="middle">loops — every request, whole session</text>
</svg>
